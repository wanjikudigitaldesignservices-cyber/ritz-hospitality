<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ritz Hospitality Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Lato',sans-serif;background:#f8f9fa;color:#333}h1,h2{font-family:'Cinzel',serif;font-weight:600;color:#000080}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000080}.lb{background:white;padding:50px;border-top:5px solid #F7E7CE;max-width:400px;width:100%;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.2)}.lb h2{margin-bottom:24px;font-size:1.8rem}.lb input{width:100%;padding:14px;border:1px solid #ddd;border-radius:2px;margin-bottom:15px;font-size:1rem;font-family:'Lato',sans-serif}.lb input:focus{border-color:#000080;outline:none}.lb button{width:100%;padding:14px;background:#000080;color:#F7E7CE;border:none;cursor:pointer;font-size:1rem;font-family:'Lato',sans-serif;text-transform:uppercase;letter-spacing:1px;font-weight:700;transition:0.3s}.lb button:hover{background:#0000b3}
.dash{display:none}.dh{background:#000080;color:#F7E7CE;padding:25px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;border-bottom:3px solid #F7E7CE}.dh h1{font-size:1.8rem;color:#F7E7CE}.dh button,.dh a{padding:10px 24px;border:1px solid #F7E7CE;cursor:pointer;font-size:0.85rem;color:#F7E7CE;background:transparent;text-decoration:none;font-family:'Lato',sans-serif;text-transform:uppercase;letter-spacing:1px;font-weight:700;transition:0.3s}.dh button:hover,.dh a:hover{background:#F7E7CE;color:#000080}.be{background:#F7E7CE!important;color:#000080!important}.be:hover{background:white!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:40px}.sc{background:white;padding:30px;border:1px solid #eee;border-left:4px solid #000080;text-align:center;box-shadow:0 10px 20px rgba(0,0,0,0.02)}.sl{font-size:0.85rem;color:#666;text-transform:uppercase;letter-spacing:1px;font-weight:700}.sv{font-size:3rem;font-family:'Cinzel',serif;margin-top:10px;color:#000080}
.tw{padding:0 40px 40px;overflow-x:auto}table{width:100%;border-collapse:collapse;background:white;border:1px solid #eee}th{background:#000080;color:white;padding:20px;text-align:left;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #F7E7CE;font-family:'Lato',sans-serif}td{padding:18px 20px;border-bottom:1px solid #eee;font-size:0.95rem;color:#333}
select.st{padding:8px 12px;border:1px solid #ddd;font-family:'Lato',sans-serif;font-size:0.9rem;background:#f8f9fa;color:#333;outline:none}.del{background:none;border:none;color:#999;cursor:pointer;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;transition:0.3s}.del:hover{color:#ef4444}
@media(max-width:768px){.stats{grid-template-columns:1fr}}</style></head>
<body>
<div class="login" id="ls"><div class="lb"><h2>Staff Portal</h2><input type="text" id="u" value="admin"><input type="password" id="p" placeholder="Password"><button onclick="login()">Enter Dashboard</button></div></div>
<div class="dash" id="dash">
<div class="dh"><h1>Event Proposals</h1><div><button class="be" onclick="exp()">Export</button> <a href="index.html">View Site</a> <button onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="sc"><div class="sl">Total Requests</div><div class="sv" id="st">0</div></div><div class="sc"><div class="sl">Pending Review</div><div class="sv" id="sn" style="color:#d97706">0</div></div><div class="sc"><div class="sl">Confirmed Events</div><div class="sv" id="sd" style="color:#059669">0</div></div></div>
<div class="tw"><table><thead><tr><th>Received</th><th>Client / Company</th><th>Contact</th><th>Event Details</th><th>Target Date</th><th>Guests</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const K='ritz_bookings';if(sessionStorage.getItem('ritz_admin')==='true')showD();
function login(){if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin123'){sessionStorage.setItem('ritz_admin','true');showD()}else alert('Invalid credentials')}
function logout(){sessionStorage.removeItem('ritz_admin');location.reload()}
function showD(){document.getElementById('ls').style.display='none';document.getElementById('dash').style.display='block';render()}
function gd(){return JSON.parse(localStorage.getItem(K)||'[]').sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt))}
function sv(d){localStorage.setItem(K,JSON.stringify(d))}
function render(){const d=gd();document.getElementById('st').textContent=d.length;document.getElementById('sn').textContent=d.filter(x=>x.status==='Pending Review').length;document.getElementById('sd').textContent=d.filter(x=>x.status==='Confirmed').length;
document.getElementById('tb').innerHTML=d.map(i=>`<tr><td>${new Date(i.submittedAt).toLocaleDateString('en-GB')}</td><td><strong>${i.company||'—'}</strong><br><span style="color:#666;font-size:0.85rem">${i.name}</span></td><td>${i.phone}<br><span style="color:#666;font-size:0.85rem">${i.email}</span></td><td><strong>${i.service||'—'}</strong><br><span style="color:#666;font-size:0.85rem">${i.location||'No Location'}</span></td><td>${i.date||'—'}</td><td>${i.guests||'—'}</td><td><select class="st" onchange="upd(${i.id},this.value)">${['Pending Review','Proposal Sent','In Negotiation','Confirmed','Completed','Cancelled'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="del" onclick="del(${i.id})">Del</button></td></tr>`).join('')}
function upd(id,s){const d=gd();const i=d.find(x=>x.id===id);if(i){i.status=s;sv(d);render()}}
function del(id){if(!confirm('Delete this request?'))return;sv(gd().filter(x=>x.id!==id));render()}
function exp(){const d=gd();if(!d.length)return alert('No data');const h=['Received','Company','Name','Phone','Email','Service','Guests','Date','Location','Details','Status'];const r=d.map(i=>[new Date(i.submittedAt).toLocaleDateString(),i.company,i.name,i.phone,i.email,i.service,i.guests,i.date,i.location,(i.details||'').replace(/\n/g,' '),i.status]);const c=[h,...r].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ritz_proposals.csv';a.click()}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
